<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="cabecalho-principal">
        <div class="logo">
            <h1>Ponto do Café</h1>
        </div>

        <nav>
            <ul class="menu-navegacao">
                <li><a href="index.html" class="link-inicial">Inicio</a></li>
                <li><a href="login.html" class="link-login">Entrar</a></li>
            </ul>
        </nav>
    </header>

    <main class="conteudo-login">
        <div class="cartao-login">
            <h2>Acessar Painel Inicial</h2>
            <p class="subtitulo-login">Digite seus dados:</p>
            <form action="#" method="POST"> <!-- form: Agrupa campos de entrada para coletar e enviar dados
            action="#" indica para onde os dados vão (temporário)
            method="POST" envia as informações de forma segura no corpo da requisição (oculta da URL) -->
                <div class="campo-grupo">
                    <label for="campo-email">Digite seu Email:</label>
                    <input
                        type="email"
                        id="campo-email"
                        name="email"
                        placeholder="Email"
                        required>
                        <!-- input: Campo interativo onde o usuário digita informações
                        type="email" valida automaticamente se há formato de email (@ e domínio)
                        id="campo-email" conecta o campo ao seu <label> correspondente
                        name="email" define o nome da chave que envia esse dado ao backend
                        placeholder="Email" texto temporário de dica que some ao digitar
                        required torna o preenchimento deste campo obrigatório para enviar o formulário -->
                </div>
                <div class="campo-grupo">
                    <label for="campo-senha">Digite sua Senha:</label>
                    <input
                        type="password"
                        id="campo-senha"
                        name="senha"
                        placeholder="Senha"
                        minlength="6"
                        required>
                        <!-- type="password" oculta os caracteres digitados por pontinhos/estrelas
                        minlength="6" exige uma quantidade mínima de 6 caracteres para permitir o envio -->
                </div>
                <div class="campo-lembrete">
                    <input type="checkbox" id="lembrar-login" name="lembrar"> <!-- type="checkbox" cria uma caixa de seleção que pode ser marcada ou desmarcada -->
                    <label for="lembrar-login">Manter minha sessão logada neste aparelho</label>
                </div>
                <button type="submit" class="btn-submeter">Entrar</button> <!-- button: Elemento de botão acionável
                type="submit": define que ao clicar, o botão dispara o envio do form -->
            </form>
            <div class="rodape-card-login">
                <a href="#">Esqueci minha senha</a>
                <span> | </span>
                <a href="#">Criar nova Conta</a>
            </div>
        </div>
    </main>

    <footer class="rodape">
        <p>&copy; 2026 Ponto do Café</p>
        <p>Desenvolvido por: <a href="portfolio.html" target="_blank" rel="noopener noreferrer">Fulano</a></p>
    </footer>
</body>
</html>
